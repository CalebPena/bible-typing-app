<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Test Data</title>
    <style>
        body {
            font-family: monospace;
            background: #323437;
            color: #d1d0c5;
            padding: 2rem;
        }
        button {
            background: #e2b714;
            color: #323437;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 1rem;
        }
        button:hover {
            opacity: 0.9;
        }
        .status {
            margin-top: 1rem;
            padding: 1rem;
            background: #2c2e31;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Bible Type - Test Data</h1>
    <p>Click the button below to populate the database with sample stats data.</p>
    <button id="add-data">Add Test Data</button>
    <button id="clear-data">Clear All Data</button>
    <div class="status" id="status">Ready</div>

    <script src="db.js"></script>
    <script>
        const BIBLE_BOOKS = [
            { name: 'Genesis', chapters: 50 },
            { name: 'Exodus', chapters: 40 },
            { name: 'Leviticus', chapters: 27 },
            { name: 'Numbers', chapters: 36 },
            { name: 'Deuteronomy', chapters: 34 },
            { name: 'Joshua', chapters: 24 },
            { name: 'Judges', chapters: 21 },
            { name: 'Ruth', chapters: 4 },
            { name: '1 Samuel', chapters: 31 },
            { name: '2 Samuel', chapters: 24 },
            { name: '1 Kings', chapters: 22 },
            { name: '2 Kings', chapters: 25 },
            { name: '1 Chronicles', chapters: 29 },
            { name: '2 Chronicles', chapters: 36 },
            { name: 'Ezra', chapters: 10 },
            { name: 'Nehemiah', chapters: 13 },
            { name: 'Esther', chapters: 10 },
            { name: 'Job', chapters: 42 },
            { name: 'Psalms', chapters: 150 },
            { name: 'Proverbs', chapters: 31 },
        ];

        function randomBetween(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateCharStats() {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,;:!?\'"()-';
            const timing = {};
            const errors = {};
            const transitions = {};
            const corrections = {};

            // Chapter-level error counts
            const errorCounts = {
                'wrong-shift': 0,
                'wrong-case': 0,
                'too-early': 0,
                'too-late': 0,
                'duplicate': 0,
                'adjacent': 0,
                'other': 0
            };
            const adjacentDirections = { up: 0, down: 0, left: 0, right: 0 };

            // Generate timing and error data for each character
            for (const char of chars) {
                const count = randomBetween(50, 500);
                const baseTime = char === ' ' ? randomBetween(80, 150) : randomBetween(100, 300);

                // Some characters are slower (like uppercase, punctuation)
                let timeMultiplier = 1;
                if (/[A-Z]/.test(char)) timeMultiplier = 1.3;
                if (/[0-9]/.test(char)) timeMultiplier = 1.2;
                if (/[.,;:!?'"()-]/.test(char)) timeMultiplier = 1.4;

                timing[char] = {
                    totalTime: Math.round(baseTime * timeMultiplier * count),
                    count
                };

                // Error rates - some chars have higher error rates
                const total = count;
                let errorRate = 0.02; // 2% base error rate
                if (/[A-Z]/.test(char)) errorRate = 0.05;
                if (/[0-9]/.test(char)) errorRate = 0.04;
                if (/[.,;:!?'"()-]/.test(char)) errorRate = 0.08;

                // Make some specific chars more error-prone
                if ('qzxjk'.includes(char.toLowerCase())) errorRate = 0.1;

                const errorCount = Math.round(total * errorRate);

                // Distribute errors among error types
                const byType = {};
                if (errorCount > 0) {
                    const errorTypes = ['wrong-shift', 'wrong-case', 'too-early', 'too-late', 'duplicate', 'adjacent', 'other'];
                    const directions = ['up', 'down', 'left', 'right'];
                    let remaining = errorCount;

                    for (const type of errorTypes) {
                        if (remaining <= 0) break;
                        const typeCount = type === 'other' ? remaining : Math.floor(Math.random() * Math.ceil(remaining / 2));
                        if (typeCount > 0) {
                            byType[type] = typeCount;
                            errorCounts[type] += typeCount;
                            remaining -= typeCount;
                            // Add direction for adjacent errors
                            if (type === 'adjacent') {
                                const dir = directions[Math.floor(Math.random() * 4)];
                                byType['adjacent-' + dir] = typeCount;
                                adjacentDirections[dir] += typeCount;
                            }
                        }
                    }
                }

                errors[char] = {
                    errors: errorCount,
                    total,
                    byType
                };
                corrections[char] = {};
                for (const [type, typeCount] of Object.entries(byType)) {
                    if (type.startsWith('adjacent-')) continue;
                    const correctedCount = randomBetween(0, typeCount);
                    if (correctedCount === 0) continue;
                    const avgExclusive = randomBetween(150, 900);
                    const avgLatency = avgExclusive + randomBetween(50, 700);
                    corrections[char][type] = {
                        correctedCount,
                        totalLatency: avgLatency * correctedCount,
                        totalExclusiveTime: avgExclusive * correctedCount
                    };
                }
                errors[char].correctionByType = corrections[char];
            }

            // Generate transition data for common pairs
            const commonPairs = [
                'th', 'he', 'in', 'er', 'an', 'nd', 'or', 'ed', 'to', 'it',
                'is', 'at', 'en', 'on', 'ha', 'es', 'st', 'nt', 're', 'ou',
                'ea', 'te', 'of', 'ti', 'ng', 'as', 'wa', 'fo', 'al', 'se',
                'e ', 't ', 's ', 'd ', ' t', ' a', ' i', ' s', ' w', ' o',
                'Th', 'An', 'He', 'In', 'Go', 'Je', 'Lo', 'Be', 'Fo', 'No'
            ];

            for (const pair of commonPairs) {
                const count = randomBetween(20, 200);
                let baseTime = randomBetween(150, 350);

                // Transitions to/from space are faster
                if (pair.includes(' ')) baseTime = randomBetween(100, 200);
                // Transitions involving uppercase are slower
                if (/[A-Z]/.test(pair)) baseTime = randomBetween(200, 400);

                transitions[pair] = {
                    totalTime: baseTime * count,
                    count
                };
            }

            // Add some notably slow transitions
            const slowPairs = ['zx', 'qp', 'jk', 'Wh', 'Qu', ',"', '."', '; '];
            for (const pair of slowPairs) {
                const count = randomBetween(10, 50);
                transitions[pair] = {
                    totalTime: randomBetween(400, 600) * count,
                    count
                };
            }

            return { timing, errors, transitions, corrections, errorCounts, adjacentDirections };
        }

        async function addTestData() {
            const status = document.getElementById('status');
            status.textContent = 'Adding test data...';

            try {
                await initDB();

                // Get existing chapters to avoid overwriting
                const existingChapters = await getAllChapterStats();
                const existingKeys = new Set(existingChapters.map(c => c.id));
                status.textContent = `Found ${existingKeys.size} existing chapters. Adding new test data...`;

                // Add completed chapters, spread across 8 weeks
                // Include both OT and NT books to ensure some don't exist yet
                const chaptersToAdd = [
                    // Genesis 1-50 (complete) - book 0
                    ...Array.from({ length: 50 }, (_, i) => ({ bookIndex: 0, chapter: i + 1 })),
                    // Exodus 1-40 (complete) - book 1
                    ...Array.from({ length: 40 }, (_, i) => ({ bookIndex: 1, chapter: i + 1 })),
                    // Leviticus 1-27 (complete) - book 2
                    ...Array.from({ length: 27 }, (_, i) => ({ bookIndex: 2, chapter: i + 1 })),
                    // Matthew 1-28 - book 39
                    ...Array.from({ length: 28 }, (_, i) => ({ bookIndex: 39, chapter: i + 1 })),
                    // Mark 1-16 - book 40
                    ...Array.from({ length: 16 }, (_, i) => ({ bookIndex: 40, chapter: i + 1 })),
                    // John 1-21 - book 42
                    ...Array.from({ length: 21 }, (_, i) => ({ bookIndex: 42, chapter: i + 1 })),
                    // Romans 1-16 - book 44
                    ...Array.from({ length: 16 }, (_, i) => ({ bookIndex: 44, chapter: i + 1 })),
                ];

                // Calculate timestamps spread across 8 weeks
                const now = Date.now();
                const msPerDay = 24 * 60 * 60 * 1000;
                const msPerWeek = 7 * msPerDay;

                // Distribute chapters across weeks with varying amounts per week
                // Some weeks above target (~24), some below, to show both positive and negative bars
                const weeklyDistribution = [15, 28, 18, 30, 12, 25, 22, 35]; // chapters per week, oldest to newest
                let chapterIndex = 0;
                let addedCount = 0;
                const chapterRecords = [];

                for (let weekNum = 0; weekNum < 8 && chapterIndex < chaptersToAdd.length; weekNum++) {
                    const weeksAgo = 7 - weekNum; // 7 weeks ago to current week
                    const weekStart = now - (weeksAgo * msPerWeek);
                    const chaptersThisWeek = Math.min(weeklyDistribution[weekNum], chaptersToAdd.length - chapterIndex);

                    for (let i = 0; i < chaptersThisWeek && chapterIndex < chaptersToAdd.length; i++) {
                        const { bookIndex, chapter } = chaptersToAdd[chapterIndex];
                        const key = `${bookIndex}-${chapter}`;

                        // Skip if chapter already exists
                        if (existingKeys.has(key)) {
                            chapterIndex++;
                            continue;
                        }

                        const wpm = randomBetween(35, 75);
                        const accuracy = randomBetween(88, 99);
                        const totalKeystrokes = randomBetween(2000, 8000);
                        const correctKeystrokes = Math.round(totalKeystrokes * (accuracy / 100));

                        // Random time within this week
                        const dayInWeek = randomBetween(0, 6);
                        const timestamp = weekStart + (dayInWeek * msPerDay) + randomBetween(0, msPerDay);

                        const { timing, errors, transitions, corrections, errorCounts, adjacentDirections } = generateCharStats();
                        const rawCorrectionTime = Object.values(corrections).reduce((charTotal, byType) => {
                            return charTotal + Object.values(byType).reduce((sum, stat) => sum + stat.totalExclusiveTime, 0);
                        }, 0);
                        const totalTime = ((totalKeystrokes / 5) / wpm) * 60000;
                        const correctionScale = rawCorrectionTime > 0
                            ? Math.min(1, (totalTime * 0.4) / rawCorrectionTime)
                            : 1;
                        for (const byType of Object.values(corrections)) {
                            for (const stat of Object.values(byType)) {
                                stat.totalExclusiveTime = Math.round(stat.totalExclusiveTime * correctionScale);
                                stat.totalLatency = Math.max(
                                    stat.totalExclusiveTime,
                                    Math.round(stat.totalLatency * correctionScale)
                                );
                            }
                        }
                        const correctionTime = Math.round(rawCorrectionTime * correctionScale);
                        const cleanMinutes = (totalTime - correctionTime) / 60000;
                        const cleanWpm = Math.round((totalKeystrokes / 5) / cleanMinutes);
                        // Generate verse times
                        const numVerses = randomBetween(10, 40);
                        const verseTimes = [];
                        for (let v = 0; v < numVerses; v++) {
                            const vChars = randomBetween(50, 200);
                            const vKeystrokes = Math.round(vChars * 1.1);
                            const vCorrect = Math.round(vKeystrokes * (randomBetween(90, 100) / 100));
                            verseTimes.push({
                                chars: vChars,
                                time: randomBetween(5000, 30000),
                                keystrokes: vKeystrokes,
                                correctKeystrokes: vCorrect
                            });
                        }
                        chapterRecords.push({
                            bookIndex,
                            chapter,
                            timestamp,
                            stats: {
                                wpm,
                                cleanWpm,
                                accuracy,
                                totalTime,
                                correctionTime,
                                totalKeystrokes,
                                correctKeystrokes,
                                charStats: { timing, errors, transitions },
                                errorCounts,
                                adjacentDirections,
                                verseTimes,
                                completedHour: randomBetween(0, 23)
                            }
                        });

                        chapterIndex++;
                        addedCount++;
                    }
                }

                status.textContent = `Writing ${chapterRecords.length} test chapters...`;
                await saveChapterStatsBatch(chapterRecords);

                // Also update localStorage with completed chapters
                const saved = localStorage.getItem('bibleTypeState');
                const state = saved ? JSON.parse(saved) : {};
                state.completedChapters = state.completedChapters || {};

                // Reset chapter index and distribute timestamps again for localStorage
                chapterIndex = 0;
                for (let weekNum = 0; weekNum < 8 && chapterIndex < chaptersToAdd.length; weekNum++) {
                    const weeksAgo = 7 - weekNum;
                    const weekStart = now - (weeksAgo * msPerWeek);
                    const chaptersThisWeek = Math.min(weeklyDistribution[weekNum], chaptersToAdd.length - chapterIndex);

                    for (let i = 0; i < chaptersThisWeek && chapterIndex < chaptersToAdd.length; i++) {
                        const { bookIndex, chapter } = chaptersToAdd[chapterIndex];
                        const key = `${bookIndex}-${chapter}`;

                        // Skip if already in localStorage
                        if (state.completedChapters[key]) {
                            chapterIndex++;
                            continue;
                        }

                        const dayInWeek = randomBetween(0, 6);
                        const timestamp = weekStart + (dayInWeek * msPerDay) + randomBetween(0, msPerDay);

                        const savedWpm = randomBetween(35, 75);
                        state.completedChapters[key] = {
                            wpm: savedWpm,
                            cleanWpm: savedWpm + randomBetween(0, 8),
                            accuracy: randomBetween(88, 99),
                            completedAt: timestamp
                        };
                        chapterIndex++;
                    }
                }

                // Set current position
                state.currentBookIndex = 2;
                state.currentChapter = 4;
                state.streak = randomBetween(3, 15);
                state.lastPracticeDate = new Date().toDateString();

                localStorage.setItem('bibleTypeState', JSON.stringify(state));

                // Add daily session test data for the past 14 days
                const dailySessions = [];
                for (let i = 0; i < 14; i++) {
                    const date = new Date();
                    date.setDate(date.getDate() - i);
                    const dateStr = date.toISOString().split('T')[0];

                    // Skip some days randomly to make it realistic
                    if (i > 0 && Math.random() < 0.3) continue;

                    const charactersTyped = randomBetween(1000, 15000);
                    const totalKeystrokes = Math.round(charactersTyped * 1.1);
                    const accuracy = randomBetween(88, 99);
                    const correctKeystrokes = Math.round(totalKeystrokes * (accuracy / 100));

                    // Progress through the Bible over the days
                    const startBook = Math.max(0, Math.floor((14 - i) / 3));
                    const startChapter = randomBetween(1, 10);
                    const endBook = startBook + (Math.random() < 0.5 ? 1 : 0);
                    const endChapter = randomBetween(startChapter, startChapter + 5);

                    dailySessions.push({
                        date: dateStr,
                        totalWpm: randomBetween(35, 75),
                        totalAccuracy: accuracy,
                        charactersTyped,
                        totalKeystrokes,
                        correctKeystrokes,
                        startPosition: {
                            bookIndex: startBook,
                            chapter: startChapter,
                            verse: randomBetween(1, 10)
                        },
                        endPosition: {
                            bookIndex: Math.min(endBook, 65),
                            chapter: endChapter,
                            verse: randomBetween(10, 30)
                        },
                        chaptersCompleted: randomBetween(1, 5),
                        versesCompleted: randomBetween(20, 100)
                    });
                }

                // Save daily sessions to IndexedDB
                for (const session of dailySessions) {
                    await saveDailySession(session);
                }

                // Add some test achievements
                const testAchievements = [
                    { id: 'chapters_1', name: 'First Steps', desc: 'Complete 1 chapter', category: 'progress', unlockedAt: Date.now() - 7 * msPerDay },
                    { id: 'chapters_10', name: 'Getting Started', desc: 'Complete 10 chapters', category: 'progress', unlockedAt: Date.now() - 6 * msPerDay },
                    { id: 'chapters_100', name: 'Century', desc: 'Complete 100 chapters', category: 'progress', unlockedAt: Date.now() - 3 * msPerDay },
                    { id: 'chapter_wpm_40', name: '40 WPM Chapter', desc: 'Complete a chapter at 40+ WPM', category: 'speed', unlockedAt: Date.now() - 7 * msPerDay },
                    { id: 'chapter_wpm_50', name: '50 WPM Chapter', desc: 'Complete a chapter at 50+ WPM', category: 'speed', unlockedAt: Date.now() - 5 * msPerDay },
                    { id: 'accuracy_97', name: '97% Accuracy', desc: 'Complete a chapter with 97%+ accuracy', category: 'accuracy', unlockedAt: Date.now() - 4 * msPerDay },
                    { id: 'streak_3', name: 'Three Day Streak', desc: '3 day streak', category: 'streak', unlockedAt: Date.now() - 5 * msPerDay },
                    { id: 'hour_10', name: '10 AM Typist', desc: 'Complete a chapter at 10:00 AM', category: 'hour', unlockedAt: Date.now() - 2 * msPerDay },
                    { id: 'hour_14', name: '2 PM Typist', desc: 'Complete a chapter at 2:00 PM', category: 'hour', unlockedAt: Date.now() - 1 * msPerDay },
                ];
                for (const achievement of testAchievements) {
                    await saveAchievement(achievement);
                }

                const skippedCount = chaptersToAdd.length - addedCount;
                status.textContent = `Success! Added ${addedCount} new chapters (${skippedCount} skipped - already exist), ${dailySessions.length} daily sessions, and ${testAchievements.length} achievements. Go to stats.html to see the results.`;
            } catch (err) {
                status.textContent = 'Error: ' + err.message;
                console.error(err);
            }
        }

        async function clearAllData() {
            const status = document.getElementById('status');

            if (!confirm('Are you sure you want to clear all data?')) {
                return;
            }

            status.textContent = 'Clearing data...';

            try {
                // Clear IndexedDB
                await new Promise((resolve, reject) => {
                    const request = indexedDB.deleteDatabase('BibleTypeDB');
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });

                // Clear localStorage
                localStorage.removeItem('bibleTypeState');

                status.textContent = 'All data cleared. Refresh the page to start fresh.';
            } catch (err) {
                status.textContent = 'Error: ' + err.message;
                console.error(err);
            }
        }

        document.getElementById('add-data').addEventListener('click', addTestData);
        document.getElementById('clear-data').addEventListener('click', clearAllData);
    </script>
</body>
</html>
