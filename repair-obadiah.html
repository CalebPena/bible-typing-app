<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair Obadiah Progress</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #181a1b;
            --panel: #232527;
            --text: #d8d6cf;
            --muted: #94928b;
            --accent: #e2b714;
            --danger: #ca4754;
            --success: #7ec699;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        main { width: min(680px, 100%); }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 8px 0; }
        .muted { color: var(--muted); }
        .warning { color: var(--accent); }
        .success { color: var(--success); }
        .error { color: var(--danger); }

        ol {
            margin: 24px 0;
            padding-left: 24px;
        }

        li { margin: 12px 0; }

        button {
            border: 0;
            border-radius: 6px;
            padding: 11px 16px;
            background: var(--accent);
            color: #181a1b;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.35;
        }

        label {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin: 20px 0;
        }

        input { margin-top: 5px; }

        #status {
            min-height: 52px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #3a3c3e;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <main>
        <h1>Repair Obadiah progress</h1>
        <p class="muted">This page only accepts the malformed one-verse Obadiah record.</p>

        <ol>
            <li>Close every other Bible Type and stats tab.</li>
            <li><button id="backup">Validate and download backup</button></li>
            <li>Confirm the JSON backup appears in your downloads.</li>
        </ol>

        <label>
            <input id="confirmed" type="checkbox" disabled>
            <span>I confirmed that the backup downloaded.</span>
        </label>

        <button id="repair" disabled>Resume Obadiah at verse 2</button>
        <div id="status" class="muted">No data has been changed.</div>
    </main>

    <script>
        const DB_NAME = 'BibleTypeDB';
        const DB_VERSION = 3;
        const TARGET_ID = '30-1';
        const TARGET_BOOK_INDEX = 30;
        const TARGET_CHAPTER = 1;
        const NEXT_BOOK_INDEX = 31;
        const VERSE_TWO_WORD_INDEX = 37;
        const VERSE_ONE_CHAR_COUNT = 197;

        const backupButton = document.getElementById('backup');
        const repairButton = document.getElementById('repair');
        const confirmed = document.getElementById('confirmed');
        const status = document.getElementById('status');
        let backupFingerprint = null;

        function requestResult(request) {
            return new Promise((resolve, reject) => {
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function transactionDone(transaction) {
            return new Promise((resolve, reject) => {
                transaction.oncomplete = resolve;
                transaction.onerror = () => reject(transaction.error);
                transaction.onabort = () => reject(transaction.error);
            });
        }

        function openDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
                request.onupgradeneeded = () => {
                    request.transaction.abort();
                    reject(new Error('Bible Type database was not initialized.'));
                };
            });
        }

        async function readStore(db, storeName) {
            const transaction = db.transaction(storeName, 'readonly');
            return requestResult(transaction.objectStore(storeName).getAll());
        }

        function getLocalDate(timestamp) {
            const date = new Date(timestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function validateIncident(db) {
            if (localStorage.getItem('obadiahRepairCompletedAt')) {
                throw new Error('This one-time repair has already run.');
            }

            const rawState = localStorage.getItem('bibleTypeState');
            if (!rawState) throw new Error('Bible Type state was not found.');

            let appState;
            try {
                appState = JSON.parse(rawState);
            } catch {
                throw new Error('Bible Type state is not valid JSON. Nothing was changed.');
            }

            const chapterTransaction = db.transaction('chapters', 'readonly');
            const chapter = await requestResult(chapterTransaction.objectStore('chapters').get(TARGET_ID));

            if (!chapter || chapter.id !== TARGET_ID || chapter.bookIndex !== TARGET_BOOK_INDEX || chapter.chapter !== TARGET_CHAPTER) {
                throw new Error('The exact Obadiah 1 record was not found. Nothing was changed.');
            }
            if (!Array.isArray(chapter.verseTimes) || chapter.verseTimes.length !== 1 || chapter.verseTimes[0]?.chars !== VERSE_ONE_CHAR_COUNT) {
                throw new Error('Obadiah is not the expected one-verse record. Nothing was changed.');
            }
            if (!appState.completedChapters?.[TARGET_ID]) {
                throw new Error('Obadiah is not marked complete in app state. Nothing was changed.');
            }
            if (appState.currentBookIndex !== NEXT_BOOK_INDEX || appState.currentChapter !== 1) {
                throw new Error('The saved position is not Jonah 1. Nothing was changed.');
            }

            const sessionDate = getLocalDate(chapter.updatedAt);
            const sessionTransaction = db.transaction('dailySessions', 'readonly');
            const session = await requestResult(sessionTransaction.objectStore('dailySessions').get(sessionDate));
            const end = session?.endPosition;

            if (!session || session.chaptersCompleted < 1 || session.versesCompleted < 1) {
                throw new Error('The matching daily session totals were not found. Nothing was changed.');
            }
            if (end?.bookIndex !== TARGET_BOOK_INDEX || end?.chapter !== TARGET_CHAPTER || end?.verse !== 1) {
                throw new Error('Obadiah 1 is not the latest completed verse. Nothing was changed.');
            }

            return { appState, chapter, session, sessionDate };
        }

        async function createBackup(db) {
            const incident = await validateIncident(db);
            const backup = {
                exportedAt: new Date().toISOString(),
                purpose: 'Before converting malformed Obadiah completion to verse 2 progress',
                localStorage: Object.fromEntries(
                    Array.from({ length: localStorage.length }, (_, index) => {
                        const key = localStorage.key(index);
                        return [key, localStorage.getItem(key)];
                    })
                ),
                indexedDB: {
                    chapters: await readStore(db, 'chapters'),
                    state: await readStore(db, 'state'),
                    dailySessions: await readStore(db, 'dailySessions'),
                    achievements: await readStore(db, 'achievements')
                }
            };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `bible-type-before-obadiah-repair-${Date.now()}.json`;
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);

            backupFingerprint = JSON.stringify({
                updatedAt: incident.chapter.updatedAt,
                completedAt: incident.appState.completedChapters[TARGET_ID].completedAt,
                session: incident.session
            });
            confirmed.disabled = false;
            status.className = 'success';
            status.textContent = 'Backup requested. Confirm it appears in your downloads before continuing.';
        }

        async function repairObadiah(db) {
            const incident = await validateIncident(db);
            const currentFingerprint = JSON.stringify({
                updatedAt: incident.chapter.updatedAt,
                completedAt: incident.appState.completedChapters[TARGET_ID].completedAt,
                session: incident.session
            });
            if (!backupFingerprint || currentFingerprint !== backupFingerprint) {
                throw new Error('Data changed after the backup. Nothing was changed. Download a new backup.');
            }

            const transaction = db.transaction(['chapters', 'dailySessions'], 'readwrite');
            transaction.objectStore('chapters').delete(TARGET_ID);
            transaction.objectStore('dailySessions').put({
                ...incident.session,
                chaptersCompleted: incident.session.chaptersCompleted - 1
            });
            await transactionDone(transaction);

            const midChapterStats = {
                bookIndex: TARGET_BOOK_INDEX,
                chapter: TARGET_CHAPTER,
                verseTimes: incident.chapter.verseTimes,
                totalKeystrokes: incident.chapter.totalKeystrokes || 0,
                correctKeystrokes: incident.chapter.correctKeystrokes || 0,
                verseKeystrokes: 0,
                verseCorrectKeystrokes: 0,
                currentWordIndex: VERSE_TWO_WORD_INDEX,
                currentLetterIndex: 0,
                typedWords: [],
                charTiming: incident.chapter.charStats?.timing || {},
                charErrors: incident.chapter.charStats?.errors || {},
                transitions: incident.chapter.charStats?.transitions || {},
                verseCorrectionStats: {},
                verseCorrectionTime: 0,
                errorCounts: incident.chapter.errorCounts || {},
                errorPositions: [],
                adjacentDirections: incident.chapter.adjacentDirections || { up: 0, down: 0, left: 0, right: 0 }
            };

            delete incident.appState.completedChapters[TARGET_ID];
            incident.appState.chapterProgress ||= {};
            incident.appState.chapterProgress[TARGET_ID] = VERSE_TWO_WORD_INDEX;
            incident.appState.currentBookIndex = TARGET_BOOK_INDEX;
            incident.appState.currentChapter = TARGET_CHAPTER;
            localStorage.setItem('midChapterStats', JSON.stringify(midChapterStats));
            localStorage.setItem('bibleTypeState', JSON.stringify(incident.appState));
            localStorage.setItem('obadiahRepairCompletedAt', new Date().toISOString());

            const savedState = JSON.parse(localStorage.getItem('bibleTypeState'));
            const savedChapter = await requestResult(
                db.transaction('chapters', 'readonly').objectStore('chapters').get(TARGET_ID)
            );
            if (savedChapter || savedState.completedChapters[TARGET_ID] || savedState.chapterProgress[TARGET_ID] !== VERSE_TWO_WORD_INDEX) {
                throw new Error('Verification failed. Keep the backup and do not open Bible Type.');
            }

            backupButton.disabled = true;
            repairButton.disabled = true;
            confirmed.disabled = true;
            status.className = 'success';
            status.textContent = 'Repair verified. Obadiah is incomplete and will resume at verse 2. You can reopen Bible Type now.';
        }

        backupButton.addEventListener('click', async () => {
            backupButton.disabled = true;
            status.className = 'muted';
            status.textContent = 'Validating the exact record and preparing the backup...';
            try {
                const db = await openDatabase();
                await createBackup(db);
                db.close();
            } catch (error) {
                backupFingerprint = null;
                confirmed.checked = false;
                confirmed.disabled = true;
                repairButton.disabled = true;
                backupButton.disabled = false;
                status.className = 'error';
                status.textContent = error.message;
            }
        });

        confirmed.addEventListener('change', () => {
            repairButton.disabled = !confirmed.checked || !backupFingerprint;
        });

        repairButton.addEventListener('click', async () => {
            repairButton.disabled = true;
            status.className = 'warning';
            status.textContent = 'Running guarded repair...';
            try {
                const db = await openDatabase();
                await repairObadiah(db);
                db.close();
            } catch (error) {
                repairButton.disabled = !confirmed.checked;
                status.className = 'error';
                status.textContent = error.message;
            }
        });
    </script>
</body>
</html>
